services:
  frontend:
    build: ./client
    ports: ["3000:3000"]
    volumes: ["./client:/app", "/app/node_modules", "/app/.next"]
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on: [backend]

  backend:
    build: ./server
    ports: ["5000:5000"]
    volumes: ["./server:/app", "/app/node_modules"]
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/blogdb
      - REDIS_URL=redis://redis:6379
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
